name: address_manager
description: A Flutter app for managing addresses and notes
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  flutter_local_notifications: ^19.5.0
  flutter_map: ^8.2.2
  geocoding: ^4.0.0
  share_plus: ^12.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo.png
    - assets/
