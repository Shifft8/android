name: address_manager
description: A Flutter app for managing addresses and notes
publish_to: 'none' # Remove this line if you plan to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2


  # Notifications
  flutter_local_notifications: ^19.5.0

  # Maps & Geocoding
  flutter_map: ^8.2.2
  geocoding: ^4.0.0

  # Sharing
  share_plus: ^12.0.1

  # Cupertino & Material
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/

  # Локализация
  generate: true
gen-l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-class: AppLocalizations
  nullable-getter: false
